name: Nightly Build

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check-updates.outputs.has_changes }}
      new_tag: ${{ steps.tagger.outputs.new_tag }}
      formatted_date: ${{ steps.tagger.outputs.formatted_date }}
    steps:
      - name: Check for updates
        id: check-updates
        run: |
          last_run=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=completed&per_page=1" | jq -r '.workflow_runs[0].created_at')

          app_updated=$(curl -s "https://api.github.com/repos/rukamori/ArchiveTune/commits?sha=dev&since=$last_run" | jq '. | length')
          core_updated=$(curl -s "https://api.github.com/repos/rukamori/core/commits?since=$last_run" | jq '. | length')
          lyrics_updated=$(curl -s "https://api.github.com/repos/rukamori/lyrics/commits?since=$last_run" | jq '. | length')
          iconpack_updated=$(curl -s "https://api.github.com/repos/rukamori/IconPack/commits?since=$last_run" | jq '. | length')
          extractor_updated=$(curl -s "https://api.github.com/repos/rukamori/moriextractor/commits?since=$last_run" | jq '. | length')
          deobfuscator_updated=$(curl -s "https://api.github.com/repos/rukamori/morideobfuscator/commits?since=$last_run" | jq '. | length')

          if [ "$app_updated" -gt "0" ] || [ "$core_updated" -gt "0" ] || [ "$lyrics_updated" -gt "0" ] || [ "$iconpack_updated" -gt "0" ] || [ "$extractor_updated" -gt "0" ] || [ "$deobfuscator_updated" -gt "0" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate build number
        id: tagger
        run: |
          echo "new_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "formatted_date=$(date +'%Y/%m/%d')" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # GMS Mobile - all ABIs
          - dist: gms
            device: Mobile
            abi: Arm64
          - dist: gms
            device: Mobile
            abi: Armeabi
          - dist: gms
            device: Mobile
            abi: X86
          - dist: gms
            device: Mobile
            abi: X86_64
          - dist: gms
            device: Mobile
            abi: Universal
          # GMS Tv - universal only
          - dist: gms
            device: Tv
            abi: Universal
          # FOSS Mobile - all ABIs
          - dist: foss
            device: Mobile
            abi: Arm64
          - dist: foss
            device: Mobile
            abi: Armeabi
          - dist: foss
            device: Mobile
            abi: X86
          - dist: foss
            device: Mobile
            abi: X86_64
          - dist: foss
            device: Mobile
            abi: Universal
          # FOSS Tv - universal only
          - dist: foss
            device: Tv
            abi: Universal
    steps:
      - name: Compute build parameters
        id: params
        run: |
          DIST="${{ matrix.dist }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"

          DIST_LOWER=$(echo "$DIST" | tr '[:upper:]' '[:lower:]')
          DEVICE_LOWER=$(echo "$DEVICE" | tr '[:upper:]' '[:lower:]')
          ABI_LOWER=$(echo "$ABI" | tr '[:upper:]' '[:lower:]')

          echo "gradle_task=assemble${DIST}${DEVICE}${ABI}Nightly" >> $GITHUB_OUTPUT
          echo "apk_dir=${DIST_LOWER}${DEVICE}${ABI}" >> $GITHUB_OUTPUT
          echo "apk_name=app-${DIST_LOWER}-${DEVICE_LOWER}-${ABI_LOWER}-nightly.apk" >> $GITHUB_OUTPUT
          echo "artifact_name=apk-${DIST_LOWER}-${DEVICE_LOWER}-${ABI_LOWER}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: rukamori/ArchiveTune
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN || secrets.PAT_TOKEN }}
          submodules: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: true

      - name: Grant permissions
        run: chmod a+x gradlew

      - name: Build APK (${{ matrix.dist }}-${{ matrix.device }}-${{ matrix.abi }})
        run: ./gradlew ${{ steps.params.outputs.gradle_task }} -PnightlyVersionName=N${{ needs.check.outputs.new_tag }}
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          NIGHTLY_BUILD_HASH: ''

      - name: Resolve release output directory
        id: release_dir
        run: |
          DIST="${{ matrix.dist }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DIST_LOWER=$(echo "$DIST" | tr '[:upper:]' '[:lower:]')
          DEVICE_LOWER=$(echo "$DEVICE" | tr '[:upper:]' '[:lower:]')
          ABI_LOWER=$(echo "$ABI" | tr '[:upper:]' '[:lower:]')
          DEVICE_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${DEVICE:0:1}")${DEVICE:1}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"

          CANDIDATES=(
            "app/build/outputs/apk/${DIST}${DEVICE_CAP}${ABI_CAP}/nightly"
            "app/build/outputs/apk/${DIST_LOWER}${DEVICE_CAP}${ABI_CAP}/nightly"
            "app/build/outputs/apk/${DIST_LOWER}${DEVICE_LOWER}${ABI_LOWER}/nightly"
            "app/build/outputs/apk/${DIST}/${DEVICE}/${ABI}/nightly"
            "app/build/outputs/apk/${DIST}${DEVICE_LOWER}${ABI_CAP}/nightly"
            "app/build/outputs/apk/${DIST}${DEVICE_CAP}${ABI_LOWER}/nightly"
          )

          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "APK output directory not found. Searching..."
          find app/build/outputs/apk -maxdepth 5 -type d 2>/dev/null || true
          echo "RELEASE_DIR_CANDIDATES checked: ${CANDIDATES[*]}"
          exit 1

      - name: Sign APK (${{ matrix.dist }}-${{ matrix.device }}-${{ matrix.abi }})
        uses: ilharp/sign-android-release@v2.0.0
        id: sign_app
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}
          signingKey: ${{ secrets.SIGNING_KEY_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move signed APK (${{ matrix.dist }}-${{ matrix.device }}-${{ matrix.abi }})
        run: |
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          SIGNED_APK=$(find "$RELEASE_DIR" -type f \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -n 1)
          mv "$SIGNED_APK" "$RELEASE_DIR/out/${{ steps.params.outputs.apk_name }}"

      - name: Upload APK artifact (${{ matrix.dist }}-${{ matrix.device }}-${{ matrix.abi }})
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.params.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.params.outputs.apk_name }}
          retention-days: 1

  release:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo for changelog
        uses: actions/checkout@v7
        with:
          repository: rukamori/ArchiveTune
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN || secrets.PAT_TOKEN }}
          submodules: true

      - name: Get changelog
        id: changelog
        run: |
          curl -o commit.py -L https://raw.githubusercontent.com/${{ github.repository }}/main/.github/assets/commit.py
          python3 commit.py
          CHANGELOG=$(cat commits.txt)
          {
            echo "content<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Download all APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: apk-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: N${{ needs.check.outputs.new_tag }}
          name: "N${{ needs.check.outputs.new_tag }}"
          body: |
            Automated nightly build generated on ${{ needs.check.outputs.formatted_date }}

            ${{ steps.changelog.outputs.content }}
          files: artifacts/*.apk
          prerelease: false

      - name: Send Discord notification
        run: |
          VERSION="N${{ needs.check.outputs.new_tag }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/$VERSION"
          MENTION_ROLE="${{ secrets.DISCORD_MENTION_ROLE }}"

          MESSAGE="# New daily version of __ArchiveTune Nightly__ has been released.

          > - Ohaiyo, **ArchiveTune $VERSION** has been released. You can view changelog and download inside **ArchiveTune Nightly** app or with this link below.
          > - **Link:** $RELEASE_URL
          > - **Mention:** $MENTION_ROLE"

          PAYLOAD=$(jq -n --arg msg "$MESSAGE" '{content: $msg}')

          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.WEBHOOK_URL }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Discord notification sent successfully"
          else
            echo "❌ Failed to send Discord notification (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Checkout repo for README update
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ github.token }}
          clean: false

      - name: Update version counters
        run: |
          VERSION="${{ needs.check.outputs.new_tag }}"
          COUNTER_LINE=""
          for (( i=0; i<${#VERSION}; i++ )); do
            DIGIT="${VERSION:$i:1}"
            if [[ "$DIGIT" =~ [0-9] ]]; then
              COUNTER_LINE+="[![Download](https://rule34.xxx/counter/${DIGIT}.gif)](https://github.com/${{ github.repository }}/releases/latest) "
            fi
          done
          COUNTER_LINE=$(echo "$COUNTER_LINE" | sed 's/ $//')

          python3 -c "
          import re
          with open('README.md', 'r') as f:
              content = f.read()
          pattern = r'\[!\[Download\]\(https://rule34\.xxx/counter/\d+\.gif\)\]\(https://github\.com/[^)]*\)(?:\s*\[!\[Download\]\(https://rule34\.xxx/counter/\d+\.gif\)\]\(https://github\.com/[^)]*\))*'
          replacement = '''$COUNTER_LINE'''
          new_content = re.sub(pattern, replacement, content)
          with open('README.md', 'w') as f:
              f.write(new_content)
          "

      - name: Commit and push
        run: |
          git config --local user.email "bot@rukamori.app"
          git config --local user.name "rukamori-bot"
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "ci: Bump version counter to N${{ needs.check.outputs.new_tag }}"
            git push origin main
          else
            echo "No changes to push!"
          fi
